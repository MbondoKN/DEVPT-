const UPDATED = "2026-11-01";
const NEW_COUNT = 0;

const $ = id => document.getElementById(id);
const state = { key: null, dir: 1 };

function parseDate(s) { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); }
const todayUTC = parseDate(UPDATED);
function fmt(s) {
  const d = parseDate(s); if (!d) return "";
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: d.getUTCFullYear() === todayUTC.getUTCFullYear() ? undefined : "numeric", timeZone: "UTC" });
}
function daysLeft(s) { const d = parseDate(s); return d ? Math.round((d - todayUTC) / 86400000) : null; }

function fillSelect(el, values) {
  [...new Set(values)].filter(Boolean).sort().forEach(v => { const o = document.createElement("option"); o.value = o.textContent = v; el.appendChild(o); });
}
fillSelect($("cat"), JOBS.map(j => j.category));
fillSelect($("reg"), JOBS.map(j => j.region));

$("meta").innerHTML = `<strong>${JOBS.length}</strong> open roles, <strong>${NEW_COUNT}</strong> new today. Updated ${fmt(UPDATED)}.`;

function cell(text, cls) { const td = document.createElement("td"); if (cls) td.className = cls; td.textContent = text || ""; return td; }

function render() {
  const q = $("q").value.trim().toLowerCase();
  let list = JOBS.filter(j =>
    (!q || [j.title, j.organization, j.location, j.summary].join(" ").toLowerCase().includes(q)) &&
    (!$("cat").value || j.category === $("cat").value) &&
    (!$("reg").value || j.region === $("reg").value) &&
    (!$("newonly").checked || j.is_new));
  if (state.key) {
    const k = state.key;
    list = [...list].sort((a, b) => {
      const av = a[k] || "\uffff", bv = b[k] || "\uffff";
      return av.localeCompare(bv) * state.dir;
    });
  }
  const tbody = $("rows"); tbody.replaceChildren();
  list.forEach(j => {
    const tr = document.createElement("tr"); if (j.is_new) tr.className = "is-new";
    const t = document.createElement("td"); t.className = "title";
    if (j.is_new) { const n = document.createElement("span"); n.className = "tag-new"; n.textContent = "New"; t.appendChild(n); }
    const a = document.createElement("a"); a.href = j.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = j.title; t.appendChild(a);
    if (j.summary) { const s = document.createElement("span"); s.className = "sum"; s.textContent = j.summary; t.appendChild(s); }
    tr.appendChild(t);
    tr.appendChild(cell(j.organization));
    tr.appendChild(cell(j.location));
    tr.appendChild(cell(j.category));
    const dl = cell(j.deadline ? fmt(j.deadline) : "Not stated", "date");
    const left = daysLeft(j.deadline);
    if (left !== null && left >= 0 && left <= 7) { const s = document.createElement("span"); s.className = "soon"; s.textContent = left === 0 ? "Closes today" : `${left} day${left === 1 ? "" : "s"} left`; dl.appendChild(s); }
    tr.appendChild(dl);
    tr.appendChild(cell(fmt(j.first_seen), "date"));
    tr.appendChild(cell(j.source));
    tbody.appendChild(tr);
  });
  $("empty").hidden = list.length > 0;
}

document.querySelectorAll("th[data-key]").forEach(th => th.querySelector("button").addEventListener("click", () => {
  const k = th.dataset.key;
  state.dir = state.key === k ? -state.dir : 1; state.key = k;
  document.querySelectorAll("th[data-key]").forEach(x => x.setAttribute("aria-sort", "none"));
  th.setAttribute("aria-sort", state.dir === 1 ? "ascending" : "descending");
  render();
}));
["q", "cat", "reg", "newonly"].forEach(id => $(id).addEventListener("input", render));
render();
</script>
